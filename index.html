<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVU Potenzialausgleich-Check</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent-red: #ef4444;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .app-header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
            text-transform: uppercase;
        }

        .app-subtitle {
            font-size: 0.85rem;
            color: var(--accent-red);
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .card-header {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 6px;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
        }

        .radio-btn input {
            position: absolute;
            opacity: 0;
        }

        .radio-btn label {
            display: block;
            text-align: center;
            padding: 10px 6px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 0;
        }

        .radio-btn input:checked + label {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .photo-uploader {
            margin-top: 10px;
            background: #f8fafc;
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .photo-uploader input[type="file"] {
            display: none;
        }

        .btn-camera {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .preview-box {
            margin-top: 10px;
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .preview-box img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .preview-box .remove-img {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-summary { background: #0f172a; color: white; }
        .btn-pdf { background: var(--accent-green); color: white; }
        .btn-reset { background: #ef4444; color: white; margin-top: 14px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            padding: 16px;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .summary-item {
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }

        .summary-item strong {
            color: var(--text-muted);
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1 class="app-title">EVU Potenzialausgleich-Check</h1>
        <div class="app-subtitle">Elektro Fachbetrieb Jordine GBP GmbH</div>
    </div>

    <form id="evuForm" onsubmit="event.preventDefault();">
        <div class="card">
            <div class="card-header">Stammdaten / Auftrag</div>
            <div class="form-group">
                <label for="datum">Datum</label>
                <input type="date" id="datum" required>
            </div>
            <div class="form-group">
                <label for="monteur">Monteur Name</label>
                <input type="text" id="monteur" placeholder="Name Monteur" required>
            </div>
            <div class="form-group">
                <label for="auftragsnr">Auftragsnummer</label>
                <input type="text" id="auftragsnr" placeholder="z. B. 2/261148" required>
            </div>
            <div class="form-group">
                <label for="adresse">Adresse / Objekt</label>
                <input type="text" id="adresse" placeholder="Straße, Hausnummer, Ort" required>
            </div>
        </div>

        <!-- 1. Hauswasseranschluss -->
        <div class="card">
            <div class="card-header">1. Hauswasseranschluss</div>
            <div class="form-group">
                <label>Material Leitung</label>
                <div class="radio-grid">
                    <div class="radio-btn"><input type="radio" id="mat_plastik" name="wasser_material" value="Plastik" checked><label for="mat_plastik">Plastik</label></div>
                    <div class="radio-btn"><input type="radio" id="mat_metall" name="wasser_material" value="Metall"><label for="mat_metall">Metall</label></div>
                    <div class="radio-btn"><input type="radio" id="mat_unbekannt" name="wasser_material" value="Unbekannt"><label for="mat_unbekannt">Unbekannt</label></div>
                </div>
            </div>
            <div class="form-group">
                <label>Erdung vor der Uhr mit Leitung verbunden?</label>
                <div class="radio-grid">
                    <div class="radio-btn"><input type="radio" id="wasser_erdung_ja" name="wasser_erdung" value="Ja" checked><label for="wasser_erdung_ja">Ja</label></div>
                    <div class="radio-btn"><input type="radio" id="wasser_erdung_nein" name="wasser_erdung" value="Nein"><label for="wasser_erdung_nein">Nein</label></div>
                </div>
            </div>
            <div class="photo-uploader">
                <label class="btn-camera" for="foto_wasser">📷 Foto Hauswasseranschluss</label>
                <input type="file" id="foto_wasser" accept="image/*" capture="environment" onchange="handlePhotoUpload(this, 'preview_wasser')">
                <div id="preview_wasser" class="preview-box hidden"></div>
            </div>
        </div>

        <!-- 2. Gasanschluss -->
        <div class="card">
            <div class="card-header">2. Gasanschluss</div>
            <div class="form-group">
                <label>Gas vorhanden?</label>
                <div class="radio-grid">
                    <div class="radio-btn"><input type="radio" id="gas_ja" name="gas_vorhanden" value="Ja" onchange="toggleGasSection(true)"><label for="gas_ja">Ja</label></div>
                    <div class="radio-btn"><input type="radio" id="gas_nein" name="gas_vorhanden" value="Nein" checked onchange="toggleGasSection(false)"><label for="gas_nein">Nein</label></div>
                </div>
            </div>
            <div id="gas_details" class="hidden">
                <div class="form-group">
                    <label>Erdung vor der Uhr mit Leitung verbunden?</label>
                    <div class="radio-grid">
                        <div class="radio-btn"><input type="radio" id="gas_erdung_ja" name="gas_erdung" value="Ja" checked><label for="gas_erdung_ja">Ja</label></div>
                        <div class="radio-btn"><input type="radio" id="gas_erdung_nein" name="gas_erdung" value="Nein"><label for="gas_erdung_nein">Nein</label></div>
                    </div>
                </div>
                <div class="photo-uploader">
                    <label class="btn-camera" for="foto_gas">📷 Foto Gasanschluss</label>
                    <input type="file" id="foto_gas" accept="image/*" capture="environment" onchange="handlePhotoUpload(this, 'preview_gas')">
                    <div id="preview_gas" class="preview-box hidden"></div>
                </div>
            </div>
        </div>

        <!-- 3. Fernwärme -->
        <div class="card">
            <div class="card-header">3. Fernwärme</div>
            <div class="form-group">
                <label>Fernwärme vorhanden?</label>
                <div class="radio-grid">
                    <div class="radio-btn"><input type="radio" id="fw_ja" name="fw_vorhanden" value="Ja" onchange="toggleFWSection(true)"><label for="fw_ja">Ja</label></div>
                    <div class="radio-btn"><input type="radio" id="fw_nein" name="fw_vorhanden" value="Nein" checked onchange="toggleFWSection(false)"><label for="fw_nein">Nein</label></div>
                </div>
            </div>
            <div id="fw_details" class="hidden">
                <div class="form-group">
                    <label>Erdung mit Leitung verbunden?</label>
                    <div class="radio-grid">
                        <div class="radio-btn"><input type="radio" id="fw_erdung_ja" name="fw_erdung" value="Ja" checked><label for="fw_erdung_ja">Ja</label></div>
                        <div class="radio-btn"><input type="radio" id="fw_erdung_nein" name="fw_erdung" value="Nein"><label for="fw_erdung_nein">Nein</label></div>
                    </div>
                </div>
                <div class="photo-uploader">
                    <label class="btn-camera" for="foto_fw">📷 Foto Fernwärme</label>
                    <input type="file" id="foto_fw" accept="image/*" capture="environment" onchange="handlePhotoUpload(this, 'preview_fw')">
                    <div id="preview_fw" class="preview-box hidden"></div>
                </div>
            </div>
        </div>

        <!-- 4. Erder -->
        <div class="card">
            <div class="card-header">4. Erder</div>
            <div class="form-group">
                <label>Erder vorhanden?</label>
                <div class="radio-grid">
                    <div class="radio-btn"><input type="radio" id="erder_ja" name="erder_vorhanden" value="Ja" checked onchange="toggleErderSection(true)"><label for="erder_ja">Ja</label></div>
                    <div class="radio-btn"><input type="radio" id="erder_nein" name="erder_vorhanden" value="Nein" onchange="toggleErderSection(false)"><label for="erder_nein">Nein</label></div>
                </div>
            </div>
            <div id="erder_details">
                <div class="photo-uploader">
                    <label class="btn-camera" for="foto_erder">📷 Foto Erder / PAS</label>
                    <input type="file" id="foto_erder" accept="image/*" capture="environment" onchange="handlePhotoUpload(this, 'preview_erder')">
                    <div id="preview_erder" class="preview-box hidden"></div>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-summary" onclick="showSummary()">📋 Zusammenfassung anzeigen</button>
        <button type="button" class="btn btn-pdf" onclick="generatePDF()">📄 PDF Erzeugen & Herunterladen</button>
        <button type="button" class="btn btn-reset" onclick="resetForm()">🔄 Formular leeren</button>
    </form>
</div>

<!-- Modal Zusammenfassung -->
<div id="summaryModal" class="modal-overlay" onclick="if(event.target===this) closeModal();">
    <div class="modal-card">
        <h2 style="margin-top:0; border-bottom: 2px solid var(--accent-red); padding-bottom: 8px;">Prüfprotokoll Zusammenfassung</h2>
        <div id="summaryContent"></div>
        <button class="btn btn-summary" style="margin-top: 16px;" onclick="closeModal()">Schließen</button>
    </div>
</div>

<script>
// Auto Set Today Date
document.getElementById('datum').valueAsDate = new Date();

const photos = { wasser: null, gas: null, fw: null, erder: null };

function toggleGasSection(show) { document.getElementById('gas_details').classList.toggle('hidden', !show); }
function toggleFWSection(show) { document.getElementById('fw_details').classList.toggle('hidden', !show); }
function toggleErderSection(show) { document.getElementById('erder_details').classList.toggle('hidden', !show); }

function handlePhotoUpload(input, previewId) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // Watermark text
            const adresse = document.getElementById('adresse').value || 'Keine Adresse';
            const datum = document.getElementById('datum').value || new Date().toISOString().split('T')[0];
            const watermarkText = `${adresse} | ${datum}`;

            const fontSize = Math.max(16, Math.floor(canvas.width / 30));
            ctx.font = `bold ${fontSize}px sans-serif`;
            
            const barHeight = fontSize * 2.2;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

            ctx.fillStyle = '#ffffff';
            ctx.textBaseline = 'middle';
            ctx.fillText(watermarkText, fontSize, canvas.height - (barHeight / 2));

            const watermarkedBase64 = canvas.toDataURL('image/jpeg', 0.85);
            const photoKey = previewId.replace('preview_', '');
            photos[photoKey] = watermarkedBase64;

            const previewBox = document.getElementById(previewId);
            previewBox.innerHTML = `
                <img src="${watermarkedBase64}" alt="Foto">
                <button type="button" class="remove-img" onclick="removePhoto('${photoKey}', '${previewId}', '${input.id}')">&times;</button>
            `;
            previewBox.classList.remove('hidden');
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function removePhoto(photoKey, previewId, inputId) {
    photos[photoKey] = null;
    document.getElementById(inputId).value = '';
    const previewBox = document.getElementById(previewId);
    previewBox.innerHTML = '';
    previewBox.classList.add('hidden');
}

function getFormData() {
    return {
        datum: document.getElementById('datum').value,
        monteur: document.getElementById('monteur').value,
        auftragsnr: document.getElementById('auftragsnr').value,
        adresse: document.getElementById('adresse').value,
        wasserMaterial: document.querySelector('input[name="wasser_material"]:checked').value,
        wasserErdung: document.querySelector('input[name="wasser_erdung"]:checked').value,
        gasVorhanden: document.querySelector('input[name="gas_vorhanden"]:checked').value,
        gasErdung: document.querySelector('input[name="gas_erdung"]:checked')?.value || 'N/A',
        fwVorhanden: document.querySelector('input[name="fw_vorhanden"]:checked').value,
        fwErdung: document.querySelector('input[name="fw_erdung"]:checked')?.value || 'N/A',
        erderVorhanden: document.querySelector('input[name="erder_vorhanden"]:checked').value
    };
}

function showSummary() {
    const d = getFormData();
    const html = `
        <div class="summary-item"><strong>Datum / Monteur</strong> ${d.datum} | ${d.monteur || '-'}</div>
        <div class="summary-item"><strong>Auftragsnummer</strong> ${d.auftragsnr || '-'}</div>
        <div class="summary-item"><strong>Adresse / Objekt</strong> ${d.adresse || '-'}</div>
        <div class="summary-item"><strong>Wasser Leitung Material</strong> ${d.wasserMaterial}</div>
        <div class="summary-item"><strong>Wasser Erdung vor Uhr verbunden</strong> ${d.wasserErdung}</div>
        <div class="summary-item"><strong>Foto Wasseranschluss</strong> ${photos.wasser ? '✅ Vorhanden' : '❌ Fehlt'}</div>
        <div class="summary-item"><strong>Gasanschluss vorhanden</strong> ${d.gasVorhanden}</div>
        ${d.gasVorhanden === 'Ja' ? `<div class="summary-item"><strong>Gas Erdung vor Uhr verbunden</strong> ${d.gasErdung}</div>` : ''}
        ${d.gasVorhanden === 'Ja' ? `<div class="summary-item"><strong>Foto Gasanschluss</strong> ${photos.gas ? '✅ Vorhanden' : '❌ Fehlt'}</div>` : ''}
        <div class="summary-item"><strong>Fernwärme vorhanden</strong> ${d.fwVorhanden}</div>
        ${d.fwVorhanden === 'Ja' ? `<div class="summary-item"><strong>Fernwärme Erdung verbunden</strong> ${d.fwErdung}</div>` : ''}
        ${d.fwVorhanden === 'Ja' ? `<div class="summary-item"><strong>Foto Fernwärme</strong> ${photos.fw ? '✅ Vorhanden' : '❌ Fehlt'}</div>` : ''}
        <div class="summary-item"><strong>Erder vorhanden</strong> ${d.erderVorhanden}</div>
        ${d.erderVorhanden === 'Ja' ? `<div class="summary-item"><strong>Foto Erder</strong> ${photos.erder ? '✅ Vorhanden' : '❌ Fehlt'}</div>` : ''}
    `;
    document.getElementById('summaryContent').innerHTML = html;
    document.getElementById('summaryModal').style.display = 'flex';
}

function closeModal() { document.getElementById('summaryModal').style.display = 'none'; }

function resetForm() {
    if (confirm('Formular wirklich zurücksetzen? Alle Eingaben und Fotos werden gelöscht.')) {
        document.getElementById('evuForm').reset();
        document.getElementById('datum').valueAsDate = new Date();
        for (let k in photos) photos[k] = null;
        ['preview_wasser', 'preview_gas', 'preview_fw', 'preview_erder'].forEach(id => {
            const box = document.getElementById(id);
            box.innerHTML = '';
            box.classList.add('hidden');
        });
        toggleGasSection(false);
        toggleFWSection(false);
        toggleErderSection(true);
    }
}

async function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const d = getFormData();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("EVU POTENZIALAUSGLEICH - PRÜFPROTOKOLL", 14, 20);

    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("Elektro Jordine GBP GmbH | Fred-Joachim-Schoeps-Str. 3 | 68229 Mannheim", 14, 26);
    doc.setDrawColor(200, 200, 200);
    doc.line(14, 28, 196, 28);

    let y = 36;
    doc.setFontSize(10);
    doc.setFont("helvetica", "bold");
    doc.text("STAMMDATEN", 14, y);
    y += 6;

    doc.setFont("helvetica", "normal");
    doc.text(`Datum: ${d.datum}`, 14, y);
    doc.text(`Monteur: ${d.monteur}`, 110, y);
    y += 6;
    doc.text(`Auftrags-Nr.: ${d.auftragsnr}`, 14, y);
    doc.text(`Adresse: ${d.adresse}`, 110, y);
    y += 10;

    doc.setFont("helvetica", "bold");
    doc.text("ERGEBNISSE DER PRÜFUNG", 14, y);
    y += 6;

    const checkData = [
        ["1. Hauswasseranschluss Material:", d.wasserMaterial],
        ["   Erdung vor Uhr verbunden:", d.wasserErdung],
        ["2. Gasanschluss vorhanden:", d.gasVorhanden],
        ["   Gas Erdung vor Uhr verbunden:", d.gasErdung],
        ["3. Fernwärme vorhanden:", d.fwVorhanden],
        ["   Fernwärme Erdung verbunden:", d.fwErdung],
        ["4. Erder vorhanden:", d.erderVorhanden]
    ];

    checkData.forEach(([label, val]) => {
        doc.text(label, 14, y);
        doc.setFont("helvetica", "bold");
        doc.text(val, 110, y);
        doc.setFont("helvetica", "normal");
        y += 6;
    });

    y += 6;
    doc.line(14, y, 196, y);
    y += 10;

    doc.setFont("helvetica", "bold");
    doc.text("DOKUMENTIERTE FOTOS", 14, y);
    y += 8;

    const photoList = [
        { label: "1. Foto Hauswasseranschluss", img: photos.wasser },
        { label: "2. Foto Gasanschluss", img: photos.gas },
        { label: "3. Foto Fernwärme", img: photos.fw },
        { label: "4. Foto Erder / PAS", img: photos.erder }
    ];

    for (const item of photoList) {
        if (item.img) {
            if (y > 230) {
                doc.addPage();
                y = 20;
            }
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.text(item.label, 14, y);
            y += 4;
            doc.addImage(item.img, 'JPEG', 14, y, 80, 50);
            y += 56;
        }
    }

    let cleanFileName = d.adresse ? d.adresse.replace(/[^a-zA-Z0-9_-]/g, '_') : 'EVU_Pruefprotokoll';
    doc.save(`${cleanFileName}.pdf`);
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(e){ console.warn('SW:', e); });
}
</script>
</body>
</html>
